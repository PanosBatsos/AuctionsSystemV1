services:
  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    networks:
      - microservices_net

  auctionssystem.accountservice.api:
    image: ${DOCKER_REGISTRY-}auctionssystemaccountserviceapi
    container_name: account-service-api
    build:
      context: .
      dockerfile: AuctionsSystem.AccountService.Api/Dockerfile
    ports:
      - "5000:8080" 
    depends_on:
      - postgres-account
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-account;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis-shared:6379
    networks:
      - microservices_net

volumes:
  postgres_account_data:

networks:
  microservices_net:
    external: true
